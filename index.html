<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>H25 GAS TURBINE GENERATOR — UNIT-20 | DIASYS Netmation SCADA Simulator</title>
<style>
:root{
  --bg:#C0C0C0; --bg2:#D4D0C8; --navy:#000080; --panel:#2B3E50; --panel2:#3A526A;
  --lime:#00FF00; --red:#FF0000; --amber:#FFFF00; --orange:#FFA500; --cyan:#00FFFF;
  --bezel-hi:#FFFFFF; --bezel-lo:#808080;
}
*{box-sizing:border-box; font-family:"MS Sans Serif",Tahoma,Verdana,Arial,sans-serif;}
html,body{margin:0;padding:0;background:var(--bg);height:100%;}
body{display:flex;flex-direction:column;height:100vh;overflow:hidden;font-size:12px;}
/* ===== TOP BANNER ===== */
#banner{background:var(--navy);color:#fff;display:flex;align-items:stretch;border-bottom:3px outset #fff;padding:2px 6px;gap:8px;min-height:86px;}
#title-block{min-width:250px;display:flex;flex-direction:column;justify-content:center;}
#title-block .t1{font-weight:bold;font-size:17px;color:#FFFF00;letter-spacing:.5px;}
#title-block .t2{font-weight:bold;font-size:15px;color:#fff;}
#title-block .t3{font-size:11px;color:#7CFCFF;}
#alarm-line{flex:1;background:#000;color:var(--red);font-weight:bold;font-size:14px;display:flex;align-items:center;padding:2px 10px;border:2px inset #808080;overflow:hidden;white-space:nowrap;}
#alarm-line.ok{color:var(--lime);}
#clockbox{background:#000;border:2px inset #808080;color:#fff;text-align:center;padding:2px 10px;min-width:150px;}
#clockbox .d{color:var(--cyan);font-weight:bold;font-size:13px;}
#clockbox .c{font-size:11px;color:#fff;}
.kpis{display:flex;gap:6px;align-items:stretch;}
.kpi{background:#000;border:2px inset #808080;min-width:104px;text-align:center;padding:2px 4px;}
.kpi .lbl{font-size:10px;color:#FFFF00;font-weight:bold;}
.kpi .val{font-size:17px;font-weight:bold;color:var(--lime);font-family:"Courier New",monospace;}
.kpi .unit{font-size:10px;color:#aaa;}
/* ===== MAIN LAYOUT ===== */
#main{flex:1;display:flex;min-height:0;}
#screen{flex:1;background:var(--bg2);border:2px inset #fff;margin:4px;overflow:auto;padding:6px;position:relative;}
#rightnav{width:172px;background:var(--bg);border-left:2px outset #fff;display:flex;flex-direction:column;padding:4px;gap:2px;overflow-y:auto;}
#rightnav .navh{background:var(--navy);color:#FFFF00;font-weight:bold;text-align:center;padding:3px;font-size:11px;}
.navbtn{background:#D4D0C8;border:2px outset #fff;padding:5px 6px;font-size:11px;font-weight:bold;cursor:pointer;text-align:left;}
.navbtn:hover{background:#e8e4dc;}
.navbtn.active{background:var(--navy);color:#FFFF00;border:2px inset #808080;}
/* ===== BOTTOM STRIP ===== */
#bottom{background:var(--bg);border-top:2px outset #fff;display:flex;align-items:center;gap:10px;padding:5px 10px;}
.pushbtn{border:3px outset #fff;padding:8px 22px;font-weight:bold;font-size:13px;cursor:pointer;}
.pushbtn:active{border-style:inset;}
#btn-reset{background:#D4D0C8;color:#000;}
#btn-trip{background:var(--red);color:#fff;font-size:15px;box-shadow:0 0 8px #f00;}
.statelamp{border:2px inset #808080;background:#000;color:var(--lime);font-weight:bold;padding:5px 10px;font-size:12px;min-width:110px;text-align:center;}
.statelamp.red{color:var(--red);} .statelamp.amber{color:var(--amber);}
#opline{margin-left:auto;display:flex;gap:6px;align-items:center;}
.opbtn{border:2px outset #fff;background:#D4D0C8;font-weight:bold;padding:6px 10px;cursor:pointer;font-size:11px;}
.opbtn:active{border-style:inset;}
.opbtn.go{background:#003300;color:var(--lime);} .opbtn.warn{background:#330000;color:var(--red);}
/* ===== PANELS ===== */
.pnl{background:var(--panel);color:#fff;border:2px outset #fff;margin-bottom:8px;}
.pnl > .ph{background:#1a2733;color:#FFFF00;font-weight:bold;padding:4px 8px;font-size:12px;border-bottom:1px solid #000;display:flex;justify-content:space-between;}
.pnl > .pb{padding:8px;}
.grid{display:grid;gap:8px;}
.lamp{display:inline-block;min-width:86px;text-align:center;font-weight:bold;font-size:11px;padding:3px 6px;border:2px inset #808080;margin:1px;}
.lamp.g{background:#003300;color:var(--lime);} .lamp.r{background:#330000;color:var(--red);} .lamp.y{background:#333300;color:var(--amber);} .lamp.c{background:#003333;color:var(--cyan);} .lamp.off{background:#222;color:#777;}
.mtile{background:var(--panel2);border:2px outset #fff;padding:6px;color:#fff;}
.mtile .tag{color:var(--cyan);font-weight:bold;font-size:11px;}
.mtile .desc{font-size:11px;color:#FFFF00;margin-bottom:4px;}
.mtile .row{display:flex;flex-wrap:wrap;gap:2px;margin:2px 0;}
.sbtn{border:2px outset #fff;background:#D4D0C8;font-weight:bold;padding:3px 12px;cursor:pointer;font-size:11px;}
.sbtn:active{border-style:inset;} .sbtn.start{background:#003300;color:var(--lime);} .sbtn.stop{background:#440000;color:#ffb0b0;}
select.mode{background:#000;color:var(--lime);font-weight:bold;border:2px inset #808080;}
/* bargraphs */
.bars{display:flex;gap:10px;flex-wrap:wrap;align-items:flex-end;}
.bgauge{background:#101418;border:2px inset #808080;width:86px;padding:4px 2px;text-align:center;position:relative;}
.bgauge .bv{font-family:"Courier New",monospace;font-weight:bold;color:var(--lime);font-size:13px;}
.bgauge .bl{font-size:10px;color:#FFFF00;min-height:30px;}
.btrack{height:150px;background:#000;position:relative;margin:4px auto;width:30px;border:1px solid #555;}
.bfill{position:absolute;bottom:0;width:100%;background:linear-gradient(to top,#00c000,#00FF00);}
.bfill.hot{background:linear-gradient(to top,#c00000,#FF0000);}
.bfill.warm{background:linear-gradient(to top,#c0a000,#FFFF00);}
.blim{position:absolute;width:100%;height:2px;} .blim.alarm{background:var(--amber);} .blim.trip{background:var(--red);}
.dcard{background:#000;border:2px inset #808080;color:var(--lime);font-family:"Courier New",monospace;padding:4px 8px;text-align:center;min-width:110px;}
.dcard .dl{font-family:Arial;font-size:10px;color:#FFFF00;font-weight:bold;}
.dcard .dv{font-size:16px;font-weight:bold;}
table.rep{width:100%;border-collapse:collapse;background:#fff;color:#000;font-size:11px;}
table.rep th{background:var(--navy);color:#FFFF00;padding:4px;border:1px solid #666;position:sticky;top:0;}
table.rep td{border:1px solid #999;padding:2px 6px;font-family:"Courier New",monospace;}
table.rep tr:nth-child(even){background:#e8e8e8;}
.ready-big{text-align:center;font-size:26px;font-weight:bold;padding:12px;border:3px outset #fff;margin-bottom:8px;}
.ready-ok{background:#003300;color:var(--lime);} .ready-no{background:#440000;color:var(--red);}
.tripgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:4px;}
canvas#polar{background:#0a0f14;border:2px inset #808080;}
.kv{display:flex;justify-content:space-between;background:#000;color:var(--lime);font-family:"Courier New",monospace;padding:2px 8px;margin:1px 0;border:1px solid #444;}
.kv span:first-child{color:#FFFF00;font-family:Arial;font-size:11px;}
#pid{background:#0d141b;border:2px inset #808080;padding:8px;color:var(--lime);font-family:"Courier New",monospace;font-size:11px;overflow-x:auto;white-space:pre;}
.flowline{color:var(--cyan);} .valve-open{color:var(--red);font-weight:bold;} .valve-shut{color:var(--lime);font-weight:bold;}
.marquee{animation:blink 1s steps(2) infinite;}
@keyframes blink{50%{opacity:.25;}}
::-webkit-scrollbar{width:12px;height:12px;} ::-webkit-scrollbar-thumb{background:#808080;border:2px outset #fff;}
</style>
</head>
<body>

<div id="banner">
  <div id="title-block">
    <div class="t1">H25 GAS TURBINE GENERATOR</div>
    <div class="t2">UNIT-20 <span style="color:#00FFFF;font-size:11px;">C32 MODEL</span></div>
    <div class="t3">DIASYS Netmation &mdash; SCADA SIMULATOR</div>
  </div>
  <div id="alarm-line" class="ok">● NO ACTIVE ALARMS — SYSTEM NORMAL</div>
  <div id="clockbox"><div class="d" id="date-line">--/--/--</div><div class="c" id="time-line">--:--:--</div></div>
  <div class="kpis">
    <div class="kpi"><div class="lbl">GEN. POWER</div><div class="val" id="kpi-mw">0.00</div><div class="unit">MW</div></div>
    <div class="kpi"><div class="lbl">FOFFD</div><div class="val" id="kpi-fuel">0.0</div><div class="unit">%</div></div>
    <div class="kpi"><div class="lbl">IGV POS</div><div class="val" id="kpi-igv">30.0</div><div class="unit">degA</div></div>
    <div class="kpi"><div class="lbl">IBH POS</div><div class="val" id="kpi-ibh">0.0</div><div class="unit">%</div></div>
  </div>
</div>

<div id="main">
  <div id="screen"></div>
  <div id="rightnav"><div class="navh">SCREEN SELECT</div><div id="navbtns" style="display:flex;flex-direction:column;gap:2px;"></div></div>
</div>

<div id="bottom">
  <button class="pushbtn" id="btn-reset">MASTER RESET</button>
  <button class="pushbtn" id="btn-trip">▼ TRIP ▼</button>
  <div class="statelamp" id="lamp-speed">0 rpm</div>
  <div class="statelamp" id="lamp-state">STOPPED</div>
  <div class="statelamp" id="lamp-brk">52G : OPEN</div>
  <div id="opline">
    <button class="opbtn go" data-op="aux">AUX START</button>
    <button class="opbtn go" data-op="crank">CRANK</button>
    <button class="opbtn go" data-op="fire">FIRE</button>
    <button class="opbtn go" data-op="sync">SYNC 52G</button>
    <button class="opbtn" data-op="loaddn">LOAD −</button>
    <button class="opbtn" data-op="loadup">LOAD +</button>
    <button class="opbtn warn" data-op="shut">SHUTDOWN</button>
  </div>
</div>

<script>
"use strict";
/* ================= STATE ================= */
const S = {
  t: 0, phase: "STOPPED", speed: 0, freq: 0,
  fuel: 0, gcv: 0, srv: 0, igv: 30.0, igvAuto: true, ibh: 0.0,
  Tamb: 28.0, cpd: 0, lubeP: 0, gasP: 0,
  Texh: 28, tcs: Array(18).fill(28), spread: 0, avgExh: 28, refExh: 28,
  MW: 0, MVAR: 0, kV: 10.92, Amp: 0, PF: 0.99,
  targetMW: 28.5, breaker: false, fired: false, tripped: false, tripCause: "",
  masterReset: true, alarms: [], latched: [],
  eoh: 23076.5, firedHrs: 18912.3, gasHrs: 18912.3, liqHrs: 0,
  firedStarts: 412, totalStarts: 438, emgPost: 7, emgTotal: 11, lastReset: "26/09/20 08:15",
  vib: {}, brgT: {}, wsT: {},
  readyCache: false
};
// motors (13)
const MOTORS = [
  {tag:"20MBV10 AP001_M01", desc:"MAIN LUBE OIL PUMP (MOP)", run:false, mode:"AUTO", avail:true, abn:false, key:"mop"},
  {tag:"20MBV20 AP001_M01", desc:"EMERG LUBE OIL PUMP (EOP DC)", run:false, mode:"AUTO", avail:true, abn:false, key:"eop"},
  {tag:"20MBA10 AH001_M01", desc:"TURNING GEAR", run:true, mode:"AUTO", avail:true, abn:false, key:"turn"},
  {tag:"20MBA10 AH002_M01", desc:"CRANKING MOTOR", run:false, mode:"MANUAL", avail:true, abn:false, key:"crank"},
  {tag:"20MSV10 AN001_M01", desc:"VENT FAN A", run:false, mode:"AUTO", avail:true, abn:false, key:"ventA"},
  {tag:"20MSV20 AN001_M01", desc:"VENT FAN B", run:false, mode:"AUTO", avail:true, abn:false, key:"ventB"},
  {tag:"20MBV11 AP001_M01", desc:"JACKING OIL PUMP (JOP)", run:false, mode:"AUTO", avail:true, abn:false, key:"jop"},
  {tag:"20MBA10 AH101_M01", desc:"GEN SPACE HEATER", run:false, mode:"AUTO", avail:true, abn:false, key:"htr1"},
  {tag:"20MBA10 AH102_M01", desc:"EXCITER SPACE HEATER", run:false, mode:"AUTO", avail:true, abn:false, key:"htr2"},
  {tag:"20MAB10 AT001_M01", desc:"INLET FILTER BLOWER", run:false, mode:"AUTO", avail:true, abn:false, key:"flt"},
  {tag:"20MBQ10 AP001_M01", desc:"HYDRAULIC / IGV PUMP", run:false, mode:"AUTO", avail:true, abn:false, key:"hyd"},
  {tag:"20MSV30 AN001_M01", desc:"SEAL AIR FAN", run:false, mode:"AUTO", avail:true, abn:false, key:"seal"},
  {tag:"20MBN10 AP001_M01", desc:"FUEL GAS HEATER FAN", run:false, mode:"AUTO", avail:true, abn:false, key:"fgh"},
];
const M = k => MOTORS.find(m=>m.key===k);
// base values
const BRG_BASE = {"LO-A":52.5,"LO-B":52.5,"LO-C":52.5,"GEN-EE":60.7,"GEN-TE":59.3,"RG-#4":57.6,"RG-#3":57.8,"RG-#2":87.8,"RG-#1":80.4,"THRUST":70.0,"TB-#2":63.6,"TB-#1":66.7};
const VIB_BASE = {"GEN2X":18.6,"GEN2Y":11.3,"GEN1X":28.8,"GEN1Y":29.6,"RG4X":22.1,"RG4Y":19.4,"RG3X":25.3,"RG3Y":21.0,"RG2X":33.2,"RG2Y":30.1,"RG1X":35.4,"RG1Y":31.8,"TB2X":61.6,"TB2Y":41.1,"TB1X":28.5,"TB1Y":5.3};
const WS_BASE = {"1FWD":485,"1AFT":470,"2FWD":504,"2AFT":476,"3FWD":488,"3AFT":329};
Object.keys(BRG_BASE).forEach(k=>S.brgT[k]=30);
Object.keys(VIB_BASE).forEach(k=>S.vib[k]=2);
Object.keys(WS_BASE).forEach(k=>S.wsT[k]=30);
for(let i=0;i<18;i++) S.tcs[i]=28;

function alarm(msg){ if(!S.latched.includes(msg)) S.latched.push(msg); if(!S.alarms.includes(msg)) S.alarms.push(msg); }
function clearAlarms(){ S.alarms = S.alarms.filter(a=>isActiveAlarm(a)); S.latched = S.latched.filter(a=>isActiveAlarm(a)); }
function isActiveAlarm(a){
  if(a.startsWith("TRIP:")) return S.tripped;
  if(a==="LUBE OIL PRESS LOW") return S.lubeP<0.1 && S.speed>500;
  if(a==="EXH TEMP HIGH") return S.Texh>600;
  if(a==="VIBRATION HIGH") return Object.values(S.vib).some(v=>v>80);
  if(a==="F&G SYSTEM TROUBLE") return false;
  return true;
}

/* ================= START CHECKS ================= */
function startChecks(){
  return [
    {g:"START CHECK 0 — POWER", items:[
      ["AC BUS NORMAL", true],["DC BUS NORMAL", true],["UPS NORMAL", true]]},
    {g:"START CHECK 1 — SHAFT", items:[
      ["ZERO SPEED / TURNING GEAR", S.speed<5 && M("turn").run],["CRANK MOTOR AVAILABLE", M("crank").avail],["JOP AVAILABLE", M("jop").avail || S.speed>500]]},
    {g:"START CHECK 2 — LUBE OIL", items:[
      ["LO HEADER PRESS > 0.1 MPa", S.lubeP>0.1],["LO TEMP > 15 °C", true],["MOP/EOP AVAILABLE", M("mop").avail && M("eop").avail]]},
    {g:"START CHECK 3 — TRIP RESET", items:[
      ["MASTER TRIP RESET", !S.tripped],["NO PROTECTIVE TRIP", !S.tripped],["OVERSPEED BOLT HEALTHY", S.speed<7788]]},
    {g:"START CHECK 4 — FUEL GAS", items:[
      ["GAS HEADER PRESS OK", S.gasP>0.5 || S.phase==="STOPPED"],["SRV/GCV CLOSED (STOP)", S.phase==="STOPPED"? (S.gcv<1&&S.srv<1):true],["F&G SYSTEM HEALTHY", true]]},
    {g:"START CHECK 5 — AIR / IGV", items:[
      ["IGV PUMP RUNNING", M("hyd").run || S.phase==="STOPPED"],["VENT FAN RUNNING", M("ventA").run||M("ventB").run],["INLET FILTER DP OK", true]]},
    {g:"START CHECK 6 — GENERATOR", items:[
      ["52G OPEN", !S.breaker],["EXCITER READY", true],["SPACE HEATERS OFF WHEN RUN", S.speed>500?(!M("htr1").run):true]]},
    {g:"START CHECK 7 — AUX", items:[
      ["SEAL AIR FAN", M("seal").run || S.phase==="STOPPED"],["BEARING TEMPS OK", Object.values(S.brgT).every(t=>t<110)],["VIBRATION OK", Object.values(S.vib).every(v=>v<100)]]},
  ];
}
function readyToStart(){ return startChecks().every(g=>g.items.every(it=>it[1])); }

/* ================= TRIP MONITOR ================= */
function tripMatrix(){
  const vibHi = Object.values(S.vib).some(v=>v>100);
  return [
    {g:"PROTECTIVE TRIPS", items:[
      ["OVERSPEED > 7788 rpm", S.speed>7788],["LOW LUBE OIL PRESS < 0.10 MPa", S.lubeP<0.1 && S.speed>500],
      ["HIGH VIBRATION > 100 um", vibHi],["MANUAL TRIP PB", S.tripped && S.tripCause==="MANUAL"] ]},
    {g:"PRE-IGNITION TRIPS", items:[
      ["FLAME DETECTOR FAULT", false],["GAS LEAK (F&G)", false],["IGNITION FAILURE", false],["CRANK TIMEOUT", false]]},
    {g:"POST-IGNITION TRIPS", items:[
      ["EXH OVERTEMP > 620 °C", S.Texh>620],["FLAME LOSS", S.fired && S.fuel<3 && S.speed>3000],
      ["HIGH EXH SPREAD > 90 °C", S.spread>90],["CPD FAULT", false]]},
  ];
}

/* ================= OPERATIONS ================= */
function op(cmd){
  if(cmd==="aux"){ ["mop","ventA","ventB","jop","hyd","seal","flt"].forEach(k=>{M(k).run=true;}); S.phase = S.speed>10?S.phase:"AUX READY"; log("AUX START — pumps & fans started"); }
  if(cmd==="crank"){
    if(S.tripped){ log("CRANK BLOCKED — TRIPPED. Press MASTER RESET"); return; }
    if(!readyToStart()){ alarm("START BLOCKED — CHECK START CHECK"); log("CRANK BLOCKED — NOT READY TO START"); return; }
    M("turn").run=false; M("crank").run=true; S.phase="CRANK"; S.totalStarts++; log("CRANKING — 0 → 2000 rpm");
  }
  if(cmd==="fire"){
    if(S.speed<1800){ log("FIRE BLOCKED — speed < 1800 rpm (crank first)"); return; }
    S.fired=true; S.fuel=12; S.gcv=8; S.srv=15; S.phase="FIRED / ACCEL"; S.firedStarts++; S.firedHrs+=0.001; log("FIRED — ignition, warm-up");
  }
  if(cmd==="sync"){
    if(!S.fired || S.speed<7150){ log("SYNC BLOCKED — need FSNL ~7260 rpm fired"); return; }
    S.breaker=true; S.phase="SYNCED / LOADED"; S.targetMW=Math.max(S.targetMW,5); log("52G CLOSED — synchronized to grid");
  }
  if(cmd==="loadup"){ S.targetMW=Math.min(32,S.targetMW+1); log("LOAD DEMAND → "+S.targetMW.toFixed(1)+" MW"); }
  if(cmd==="loaddn"){ S.targetMW=Math.max(2,S.targetMW-1); log("LOAD DEMAND → "+S.targetMW.toFixed(1)+" MW"); }
  if(cmd==="shut"){ shutdown("NORMAL SHUTDOWN"); }
}
function shutdown(reason){
  S.breaker=false; S.fired=false; S.fuel=0; S.gcv=0; S.srv=0; M("crank").run=false;
  if(S.speed>10) S.phase="COAST DOWN"; else S.phase="STOPPED";
  log(reason+" — fuel cut, 52G open");
}
function doTrip(cause){
  if(S.tripped) return;
  S.tripped=true; S.tripCause=cause; S.fired=false; S.breaker=false; S.fuel=0; S.gcv=0; S.srv=0; M("crank").run=false;
  S.phase="TRIPPED"; S.emgTotal++; if(S.speed>3000) S.emgPost++;
  alarm("TRIP: "+cause); log("★★★ TRIP: "+cause+" ★★★");
}
const LOG=[];
function log(m){ const d=new Date(); LOG.unshift(d.toLocaleTimeString()+"  "+m); if(LOG.length>60)LOG.pop(); const el=document.getElementById("oplog"); if(el) el.innerHTML=LOG.map(x=>"• "+x).join("<br>"); }

/* ================= PHYSICS 10 Hz ================= */
let noiseT=0;
function tick(){
  const dt=0.1; S.t+=dt; noiseT+=dt;
  // lube oil pressure
  const pumpOn = M("mop").run||M("eop").run;
  const lubeTgt = pumpOn?0.49:0.0;
  S.lubeP += (lubeTgt-S.lubeP)*Math.min(1,dt*0.8);
  // gas header pressure
  S.gasP += ((S.fired||S.phase!=="STOPPED"?2.1:0)-S.gasP)*dt*0.5;
  // speed dynamics
  let tgt=0, rate=60;
  if(S.tripped || S.phase==="TRIPPED"){ tgt=0; rate=55; if(S.speed<5){S.phase="STOPPED";} }
  else if(S.phase==="CRANK"){ tgt=2000; rate=160; if(S.speed>=1950){/*hold for fire*/} }
  else if(S.phase==="FIRED / ACCEL"){ tgt=7260; rate=95; if(S.speed>=7240){S.phase="FSNL"; log("FSNL REACHED — 7260 rpm / 50.0 Hz. Ready to SYNC");} }
  else if(S.phase==="FSNL"){ tgt=7260; rate=60; }
  else if(S.phase==="SYNCED / LOADED"){ tgt=7260; rate=30; }
  else if(S.phase==="COAST DOWN"){ tgt=0; rate=55; if(S.speed<5){S.phase="STOPPED"; M("turn").run=true;} }
  else if(S.phase==="AUX READY"){ tgt=0; rate=60; }
  if(S.phase!=="STOPPED" && !(S.tripped) || S.speed>1){
    if(S.speed<tgt) S.speed=Math.min(tgt,S.speed+rate*dt);
    else S.speed=Math.max(tgt,S.speed-rate*dt);
  }
  if(S.speed<3 && S.phase==="STOPPED"){ if(M("turn").run) S.speed=0; }
  S.freq = S.speed/7260*50;
  // fuel / IGV / IBH logic
  if(S.tripped){ S.fuel=Math.max(0,S.fuel-40*dt); }
  else if(S.breaker){ // load follow
    const fuelTgt = 22 + S.targetMW/0.663;
    S.fuel += (fuelTgt-S.fuel)*Math.min(1,dt*0.7);
    // MW from fuel with small droop vs freq
    S.MW = (S.fuel-22)*0.663 + (50-S.freq)*2.0;
    S.MW = Math.max(0,S.MW);
  } else if(S.fired){
    if(S.phase==="FSNL"){ S.fuel += (24.5-S.fuel)*dt*0.5; }
    else { // accel schedule
      const fT = 12 + (S.speed/7260)*13; S.fuel += (fT-S.fuel)*dt*0.6;
    }
    S.MW=0;
  } else { if(!S.tripped && S.phase!=="CRANK") S.fuel=Math.max(0,S.fuel-8*dt); S.MW=0; }
  if(S.igvAuto && !S.tripped){
    const igvT = S.breaker ? (30+52.7*Math.min(1,S.MW/30)) : (S.fired? (34+ (S.speed/7260)*8) : 30);
    S.igv += (Math.min(82.7,igvT)-S.igv)*Math.min(1,dt*0.5);
  }
  if(!S.fired && !S.breaker){ S.gcv=Math.max(0,S.gcv-30*dt); S.srv=Math.max(0,S.srv-30*dt); }
  else { S.gcv+=(Math.min(100,S.fuel*1.15)-S.gcv)*dt; S.srv+=(Math.min(100,S.fuel*1.35)-S.srv)*dt; }
  // CPD
  const nn=S.speed/7260;
  S.cpd = 1.30*Math.pow(Math.max(0,nn),2)*(0.35+0.65*(S.igv/82.7));
  // exhaust temp
  const Ttgt = 25 + 6*S.fuel + 44.5*(S.speed/1000) - 1.7*S.igv;
  S.Texh += (Math.max(S.Tamb,Ttgt)-S.Texh)*Math.min(1,dt*0.6);
  const n1=Math.sin(noiseT*1.7)*4+Math.sin(noiseT*0.6)*5;
  for(let i=0;i<18;i++){
    const g = Math.sin(noiseT*0.9+i*2.1)*9 + Math.sin(noiseT*2.3+i*0.7)*6 + n1*0.4;
    S.tcs[i] += ((S.Texh+g)-S.tcs[i])*Math.min(1,dt*1.2);
  }
  S.avgExh = S.tcs.reduce((a,b)=>a+b,0)/18;
  S.refExh = S.avgExh+1.3+Math.sin(noiseT)*1.5;
  S.spread = Math.max(...S.tcs)-Math.min(...S.tcs);
  // electrical
  if(S.breaker){ S.kV=10.92+Math.sin(noiseT*0.8)*0.02; S.PF=0.99;
    S.Amp = S.MW*1000/(Math.sqrt(3)*S.kV*S.PF+1e-6);
    S.MVAR = S.MW*0.14+Math.sin(noiseT*0.5)*0.2;
  } else { S.Amp=0; S.MVAR=0; if(S.speed>7000) S.kV=10.9; else S.kV=Math.max(0,S.speed/7260*10.9); }
  // bearing temps approach load targets
  const loadF = S.breaker? S.MW/30 : (S.fired?0.35:0);
  Object.keys(BRG_BASE).forEach(k=>{
    const base=BRG_BASE[k]; const cold=30;
    const tgt2 = S.speed<100? cold : cold+(base-cold)*Math.min(1,(0.25+0.75*Math.min(1,S.speed/7260))*(0.7+0.3*loadF+0.15));
    S.brgT[k]+= (tgt2+Math.sin(noiseT+iHash(k))*0.6 - S.brgT[k])*Math.min(1,dt*0.05);
  });
  Object.keys(WS_BASE).forEach(k=>{
    const base=WS_BASE[k];
    const tgt2 = S.fired? base*(0.55+0.45*Math.min(1,S.speed/7260)) : 30;
    S.wsT[k]+= (tgt2+Math.sin(noiseT*1.3+iHash(k)*2)*3 - S.wsT[k])*Math.min(1,dt*0.08);
  });
  // vibration
  const res = Math.exp(-Math.pow((S.speed-4200)/900,2))*25; // critical pass
  Object.keys(VIB_BASE).forEach(k=>{
    const base=VIB_BASE[k];
    const runF = Math.min(1,S.speed/7260);
    const tgt2 = 2 + (base-2)*runF + res*runF*0.6 + (S.breaker? S.MW/30*6:0);
    S.vib[k]+= (tgt2+Math.sin(noiseT*7+iHash(k)*5)*1.8 - S.vib[k])*Math.min(1,dt*1.5);
  });
  // trips
  if(!S.tripped && S.speed>500){
    if(S.lubeP<0.1) doTrip("LOW LUBE OIL PRESS < 0.10 MPa");
    else if(Object.values(S.vib).some(v=>v>100)) doTrip("HIGH VIBRATION > 100 um");
    else if(S.Texh>620) doTrip("EXH OVERTEMP > 620 °C");
    else if(S.speed>7788) doTrip("OVERSPEED > 7788 rpm");
    else if(S.fired && S.fuel<3 && S.speed>3000) doTrip("FLAME LOSS");
    else if(S.spread>120) doTrip("EXH SPREAD HIGH");
  }
  if(!S.tripped && S.speed>7788) doTrip("OVERSPEED > 7788 rpm");
  if(S.fired){ S.firedHrs+=dt/3600; S.eoh+=dt/3600*1.2; }
  updateHeader(); updateBottom(); updateScreenDyn();
}
function iHash(s){ let h=0; for(const c of s) h=(h*31+c.charCodeAt(0))%97; return h/10; }

/* ================= HEADER / BOTTOM ================= */
function updateHeader(){
  setT("kpi-mw", S.MW.toFixed(2)); setT("kpi-fuel", S.fuel.toFixed(1));
  setT("kpi-igv", S.igv.toFixed(1)); setT("kpi-ibh", S.ibh.toFixed(1));
  const now=new Date();
  const days=["Sun","Mon","Tue","Wed","Thu","Fri","Sat"];
  const p=n=>String(n).padStart(2,"0");
  let h=now.getHours(), ap=h>=12?"PM":"AM", h12=h%12||12;
  document.getElementById("date-line").textContent =
    `${String(now.getFullYear()).slice(2)}/${p(now.getMonth()+1)}/${p(now.getDate())} (${days[now.getDay()]}) ${ap} ${p(h12)}:${p(now.getMinutes())}`;
  document.getElementById("time-line").textContent = `${p(h12)}:${p(now.getMinutes())}:${p(now.getSeconds())} ${ap}  JST`;
  const al=document.getElementById("alarm-line");
  const act=[...S.alarms.filter(isActiveAlarm)];
  if(S.tripped) act.unshift("TRIP: "+S.tripCause);
  if(act.length===0){ al.className="ok"; al.textContent="● NO ACTIVE ALARMS — SYSTEM NORMAL"; }
  else { al.className="marquee"; al.textContent="▲ "+act.slice(0,3).join("   ///   ")+(act.length>3?`   (+${act.length-3} MORE)`:""); }
}

function drawPolar(){
  const c=document.getElementById("polar"); if(!c) return; const x=c.getContext("2d");
  const cx=215, cy=215, R=195; x.clearRect(0,0,430,430);
  const t2r=(t)=>(R*(t-200)/600);
  x.strokeStyle="#334455"; x.fillStyle="#9fd8ff"; x.font="10px monospace";
  [200,300,400,500,600,700,800].forEach(t=>{ x.beginPath(); x.arc(cx,cy,t2r(t),0,7); x.stroke(); x.fillText(t+"°",cx+3,cy-t2r(t)-2); });
  for(let i=0;i<18;i++){ const a=i/18*Math.PI*2-Math.PI/2;
    x.strokeStyle="#223344"; x.beginPath(); x.moveTo(cx,cy); x.lineTo(cx+Math.cos(a)*R,cy+Math.sin(a)*R); x.stroke();
    x.fillStyle="#FFFF00"; x.fillText("CT"+String(i+1).padStart(3,"0"),cx+Math.cos(a)*(R+4)-14,cy+Math.sin(a)*(R+4)+3); }
  x.beginPath();
  S.tcs.forEach((t,i)=>{ const a=i/18*Math.PI*2-Math.PI/2; const r=Math.max(2,t2r(Math.max(200,Math.min(800,t))));
    const px=cx+Math.cos(a)*r, py=cy+Math.sin(a)*r; i?x.lineTo(px,py):x.moveTo(px,py); });
  x.closePath(); x.fillStyle="rgba(0,255,255,.25)"; x.fill(); x.strokeStyle="#00FFFF"; x.lineWidth=2; x.stroke();
  x.fillStyle="#00FFFF"; S.tcs.forEach((t,i)=>{ const a=i/18*Math.PI*2-Math.PI/2; const r=t2r(Math.max(200,Math.min(800,t)));
    x.fillRect(cx+Math.cos(a)*r-2,cy+Math.sin(a)*r-2,4,4); });
}
function drawSynch(){
  const c=document.getElementById("synch"); if(!c) return; const x=c.getContext("2d");
  x.clearRect(0,0,300,120); x.strokeStyle="#333"; x.strokeRect(5,5,290,110);
  x.strokeStyle="#00FF00"; x.beginPath(); x.moveTo(150,10); x.lineTo(150,110); x.stroke();
  const slip=(S.freq-50)*12; const a=(noiseT*(2+slip))% (Math.PI*2);
  const nx=150+Math.cos(a)*110, ny=60+Math.sin(a)*40;
  x.fillStyle=S.breaker?"#FF0000":"#00FFFF"; x.beginPath(); x.arc(nx,ny,6,0,7); x.fill();
  x.fillStyle="#FFFF00"; x.font="10px monospace"; x.fillText("SLIP "+(S.freq-50).toFixed(2)+" Hz",10,20);
}

/* ================= EVENTS ================= */
document.getElementById("btn-trip").onclick=()=>doTrip("MANUAL");
document.getElementById("btn-reset").onclick=()=>{ if(!S.tripped){clearAlarms(); log("MASTER RESET — latched alarms cleared");} else if(!isActiveAlarm("x")){/*still tripped*/} 
  if(S.tripped && S.speed<100){ S.tripped=false; S.tripCause=""; S.phase="STOPPED"; M("turn").run=true; clearAlarms(); log("MASTER RESET — trip reset, turning gear ON"); }
  else if(S.tripped){ log("RESET BLOCKED — shaft still rolling ("+Math.round(S.speed)+" rpm)"); } };
document.querySelectorAll("#opline [data-op]").forEach(b=>b.onclick=()=>op(b.dataset.op));
